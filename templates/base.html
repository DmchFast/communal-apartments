{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Коммуналка{% endblock %}</title>
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Собственные стили -->
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'homepage:index' %}">🏢 Коммуналка</a>
            <div class="d-flex">
                <a class="nav-link" href="{% url 'homepage:index' %}">Главная</a>
                <a class="nav-link" href="{% url 'meters:meters' %}">Счётчики</a>
                <a class="nav-link" href="{% url 'payments:payments' %}">Платежи</a>
            </div>
        </div>
    </nav>

    <main class="container pb-5">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="container mt-4 mb-3">
        <p>© <span id="current-year"></span> Коммуналка</p>
    </footer>

    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
